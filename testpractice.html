Bloque C2

Bloque S2

];

const form = document.getElementById("quizForm");

let areaActual = "";

preguntas.forEach((q,index)=>{

if(q.area !== areaActual){

areaActual = q.area;

const titulo =
document.createElement("h2");

titulo.className = "section-title";

titulo.innerText = areaActual;

form.appendChild(titulo);

}

const div =
document.createElement("div");

div.className = "question";

let html =
`<h3>${index+1}. ${q.pregunta}</h3>`;

q.opciones.forEach((op,i)=>{

html += `
<div class="option">
<label>
<input type="radio"
name="q${index}"
value="${i}">
${op}
</label>
</div>
`;

});

div.innerHTML = html;

form.appendChild(div);

});

document.addEventListener(
"change",
actualizarBarra
);

function actualizarBarra(){

const respondidas =
document.querySelectorAll(
'input[type=radio]:checked'
).length;

const porcentaje =
(respondidas/preguntas.length)*100;

document.getElementById(
"progressBar"
).style.width =
porcentaje + "%";

}

function terminarExamen(){

document.querySelector("button").disabled = true;

let aciertos = 0;

let estadisticas = {};

preguntas.forEach((q,index)=>{

if(!estadisticas[q.area]){

estadisticas[q.area]={
correctas:0,
total:0
};

}

estadisticas[q.area].total++;

let seleccion =
document.querySelector(
`input[name=q${index}]:checked`
);

const bloque =
document.querySelectorAll(
".question"
)[index];

if(
seleccion &&
parseInt(seleccion.value)
=== q.correcta
){

aciertos++;

estadisticas[q.area]
.correctas++;

bloque.classList.add(
"correct"
);

}else{

bloque.classList.add(
"incorrect"
);

}

});

let errores =
preguntas.length - aciertos;

let porcentaje =
(
(aciertos/preguntas.length)
*100
).toFixed(1);

let detalle = "";

for(let area in estadisticas){

const datos =
estadisticas[area];

const porcentajeArea =
(
(datos.correctas /
datos.total)
*100
).toFixed(1);

detalle += `
<tr>
<td>${area}</td>
<td>${datos.correctas}/${datos.total}</td>
<td>${porcentajeArea}%</td>
</tr>
`;

}

document.getElementById(
"resultado"
).style.display =
"block";

document.getElementById(
"resultado"
).innerHTML = `

<h2>Resultado General</h2>

<p><b>Aciertos:</b>
${aciertos}</p>

<p><b>Errores:</b>
${errores}</p>

<p><b>Porcentaje:</b>
${porcentaje}%</p>

<h3>Desempeño por área</h3>

<table>

<tr>
<th>Área</th>
<th>Aciertos</th>
<th>Porcentaje</th>
</tr>

${detalle}

</table>

`;

window.scrollTo(0,0);

}

let tiempo = 10800;

setInterval(()=>{

let h =
Math.floor(tiempo/3600);

let m =
Math.floor(
(tiempo%3600)/60
);

let s =
tiempo%60;

document.getElementById(
"timer"
).innerText =

String(h).padStart(2,"0")
+ ":" +
String(m).padStart(2,"0")
+ ":" +
String(s).padStart(2,"0");

if(tiempo>0){
tiempo--;
}

},1000);

</script>
