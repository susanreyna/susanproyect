body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;

.container{

margin:auto;
background:white;
padding:20px;
border-radius:10px;

h1{

}

font-size:22px;

}

.progress{

.section-title{

button{

background:#2a9d8f;

border-radius:8px;

}

button:hover{
background:#21867a;
}

.correct{
background:#d4edda;
}

.incorrect{
background:#f8d7da;
}

#resultado{
display:none;
margin-top:30px;
padding:20px;
border:2px solid #2a9d8f;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

/*
Aquí irán todos los bloques:

Bloque E1
Bloque E2
Bloque E3
Bloque E4

Bloque M1
Bloque M2
Bloque M3
Bloque M4

Bloque C1
Bloque C2

Bloque S1
Bloque S2
*/

];

const form = document.getElementById("quizForm");

let areaActual = "";

preguntas.forEach((q,index)=>{

if(q.area !== areaActual){

areaActual = q.area;

const titulo =
document.createElement("h2");

titulo.className = "section-title";

titulo.innerText = areaActual;

form.appendChild(titulo);

}

const div =
document.createElement("div");

div.className = "question";

let html =
`<h3>${index+1}. ${q.pregunta}</h3>`;

q.opciones.forEach((op,i)=>{

html += `
<div class="option">
<label>
<input type="radio"
name="q${index}"
value="${i}">
${op}
</label>
</div>
`;

});

div.innerHTML = html;

form.appendChild(div);

});

document.addEventListener(
"change",
actualizarBarra
);

function actualizarBarra(){

const respondidas =
document.querySelectorAll(
'input[type=radio]:checked'
).length;

const porcentaje =
(respondidas/preguntas.length)*100;

document.getElementById(
"progressBar"
).style.width =
porcentaje + "%";

}

function terminarExamen(){

document.querySelector("button").disabled = true;

let aciertos = 0;

let estadisticas = {};

preguntas.forEach((q,index)=>{

if(!estadisticas[q.area]){

estadisticas[q.area]={
correctas:0,
total:0
};

}

estadisticas[q.area].total++;

let seleccion =
document.querySelector(
`input[name=q${index}]:checked`
);

const bloque =
document.querySelectorAll(
".question"
)[index];

if(
seleccion &&
parseInt(seleccion.value)
=== q.correcta
){

aciertos++;

estadisticas[q.area]
.correctas++;

bloque.classList.add(
"correct"
);

}else{

bloque.classList.add(
"incorrect"
);

}

});

let errores =
preguntas.length - aciertos;

let porcentaje =
(
(aciertos/preguntas.length)
*100
).toFixed(1);

let detalle = "";

for(let area in estadisticas){

const datos =
estadisticas[area];

const porcentajeArea =
(
(datos.correctas /
datos.total)
*100
).toFixed(1);

detalle += `
<tr>
<td>${area}</td>
<td>${datos.correctas}/${datos.total}</td>
<td>${porcentajeArea}%</td>
</tr>
`;

}

document.getElementById(
"resultado"
).style.display =
"block";

document.getElementById(
"resultado"
).innerHTML = `

<h2>Resultado General</h2>

<p><b>Aciertos:</b>
${aciertos}</p>

<p><b>Errores:</b>
${errores}</p>

<p><b>Porcentaje:</b>
${porcentaje}%</p>

<h3>Desempeño por área</h3>

<table>

<tr>
<th>Área</th>
<th>Aciertos</th>
<th>Porcentaje</th>
</tr>

${detalle}

</table>

`;

window.scrollTo(0,0);

}

let tiempo = 10800;

setInterval(()=>{

let h =
Math.floor(tiempo/3600);

let m =
Math.floor(
(tiempo%3600)/60
);

let s =
tiempo%60;

document.getElementById(
"timer"
).innerText =

String(h).padStart(2,"0")
+ ":" +
String(m).padStart(2,"0")
+ ":" +
String(s).padStart(2,"0");

if(tiempo>0){
tiempo--;
}

},1000);

</script>
