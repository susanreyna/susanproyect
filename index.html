const form = document.getElementById("quizForm");

preguntas.forEach((q,index)=>{
let div=document.createElement("div");
div.className="question";

let html=`<h3>${q.pregunta}</h3>`;

q.opciones.forEach((op,i)=>{
html+=`
<div class="option">
<label>
<input type="radio" name="q${index}" value="${i}">
${op}
</label>
</div>`;
});

div.innerHTML=html;
form.appendChild(div);
});

function actualizarBarra(){
const respondidas =
document.querySelectorAll('input[type=radio]:checked').length;

const porcentaje =
(respondidas/preguntas.length)*100;

document.getElementById("progressBar").style.width =
porcentaje+"%";
}

document.addEventListener("change",actualizarBarra);

function terminarExamen(){

let aciertos = 0;

let estadisticas = {
"Español": {correctas:0,total:0},
"Matemáticas": {correctas:0,total:0},
"Ciencias": {correctas:0,total:0},
"Sociales": {correctas:0,total:0}
};

preguntas.forEach((q,index)=>{

if(!estadisticas[q.area]){
estadisticas[q.area] = {
correctas:0,
total:0
};
}

estadisticas[q.area].total++;

let seleccion =
document.querySelector(`input[name=q${index}]:checked`);

if(
seleccion &&
parseInt(seleccion.value) === q.correcta
){

aciertos++;
estadisticas[q.area].correctas++;

}

});

let errores =
preguntas.length - aciertos;

let porcentaje =
((aciertos/preguntas.length)*100).toFixed(1);

let resumenAreas = "";

Object.keys(estadisticas).forEach(area=>{

let datos = estadisticas[area];

if(datos.total > 0){

let porcentajeArea =
(
(datos.correctas/datos.total)*100
).toFixed(1);

resumenAreas += `
<tr>
<td>${area}</td>
<td>${datos.correctas}/${datos.total}</td>
<td>${porcentajeArea}%</td>
</tr>
`;

}

});

const resultado =
document.getElementById("resultado");

resultado.style.display = "block";

resultado.innerHTML = `
<h2>Resultado General</h2>

<p><b>Aciertos:</b> ${aciertos}</p>
<p><b>Errores:</b> ${errores}</p>
<p><b>Porcentaje:</b> ${porcentaje}%</p>

<h3>Desempeño por área</h3>

<table border="1"
style="width:100%;border-collapse:collapse;text-align:center;">
<tr>
<th>Área</th>
<th>Aciertos</th>
<th>Porcentaje</th>
</tr>

${resumenAreas}

</table>
`;

window.scrollTo(0,0);

}
});

let errores = preguntas.length - aciertos;

let porcentaje =
((aciertos/preguntas.length)*100).toFixed(1);

const resultado =
document.getElementById("resultado");

resultado.style.display = "block";

resultado.innerHTML = `

<hr>

<h3>Preguntas incorrectas</h3>

${detalle || "<p>¡Perfecto! No hubo errores.</p>"}
`;

window.scrollTo(
0,
document.body.scrollHeight
);

let tiempo=10800;

setInterval(()=>{
let h=Math.floor(tiempo/3600);
let m=Math.floor((tiempo%3600)/60);
let s=tiempo%60;

document.getElementById("timer").innerText=
String(h).padStart(2,'0')+":"+
String(m).padStart(2,'0')+":"+
String(s).padStart(2,'0');

if(tiempo>0){

}
},1000);
